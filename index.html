<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏆 Leaderboard · Supabase</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0b0e14;font-family:system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:1rem;color:#e8edf5}
        .card{max-width:720px;width:100%;background:#141a24;border-radius:2rem;padding:2rem;box-shadow:0 25px 50px -12px rgba(0,0,0,0.8);border:1px solid #2a3344}
        h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#b7c9ff,#7aa3ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:0.2rem}
        .sub{color:#7e8aa8;font-size:0.85rem;margin-bottom:1.8rem;border-left:3px solid #2a3a5a;padding-left:0.9rem;display:flex;flex-wrap:wrap;gap:0.5rem 1.2rem}
        .sub span{background:#1f293b;padding:0.15rem 0.7rem;border-radius:20px;font-family:monospace;font-size:0.7rem;color:#9bb1d9}
        .form-row{display:flex;flex-wrap:wrap;gap:0.9rem;margin-bottom:1.8rem}
        .form-group{flex:1 1 170px;min-width:130px}
        .form-group label{display:block;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.04em;color:#7e8aa8;margin-bottom:0.25rem;font-weight:600}
        .form-group input{width:100%;padding:0.7rem 1rem;background:#1a2330;border:1px solid #2d3a4e;border-radius:14px;color:#e8edf5;font-size:1rem;outline:none;transition:0.2s}
        .form-group input:focus{border-color:#5a7fd4;box-shadow:0 0 0 3px rgba(90,127,212,0.2);background:#1e293b}
        .btn{background:#2d4a8a;border:none;border-radius:14px;padding:0.7rem 2rem;font-weight:600;font-size:1rem;color:#fff;cursor:pointer;transition:0.2s;display:inline-flex;align-items:center;gap:0.5rem;align-self:flex-end;margin-bottom:0.2rem;border:1px solid #3e5fa0}
        .btn:hover{background:#3a5daa}
        .btn:disabled{opacity:0.5;pointer-events:none}
        .msg{padding:0.6rem 1rem;border-radius:12px;margin-bottom:1.4rem;font-size:0.9rem;display:none;background:#1a2330;border-left:4px solid #4a6a9a}
        .msg.show{display:block}
        .msg.success{border-left-color:#4ac78a;background:#142a1e;color:#a3f0c5}
        .msg.error{border-left-color:#d45a5a;background:#2a1a1a;color:#ffb3b3}
        .lb-header{display:flex;justify-content:space-between;align-items:baseline;margin:1.8rem 0 0.8rem 0;padding-bottom:0.4rem;border-bottom:1px solid #1f2a3a}
        .lb-header h2{font-size:1.2rem;font-weight:600;color:#c8d6f0}
        .lb-header .count{font-size:0.75rem;color:#5e749a;background:#1a2330;padding:0.2rem 0.8rem;border-radius:20px}
        .lb-list{list-style:none;display:flex;flex-direction:column;gap:0.3rem;max-height:400px;overflow-y:auto;padding-right:0.2rem}
        .lb-item{display:flex;align-items:center;gap:0.8rem;padding:0.6rem 1rem;background:#111a26;border-radius:12px;border:1px solid #1f293b;transition:0.15s}
        .lb-item:hover{background:#17212f;border-color:#2a3a5a}
        .lb-rank{font-weight:700;font-size:0.8rem;color:#5e749a;min-width:28px;text-align:center}
        .lb-rank.gold{color:#f7c948}
        .lb-rank.silver{color:#a8b8d8}
        .lb-rank.bronze{color:#cd8f6b}
        .lb-name{flex:1;font-weight:500;color:#d6e0f5;word-break:break-word}
        .lb-score{font-weight:700;font-size:1.1rem;color:#8bb3ff;background:#1a2538;padding:0.1rem 0.9rem;border-radius:40px}
        .lb-empty{color:#4a5a78;text-align:center;padding:2rem 0;font-size:0.95rem}
        .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;margin-right:8px}
        @keyframes spin{to{transform:rotate(360deg)}}
        @media (max-width:540px){.card{padding:1.2rem}.form-row{flex-direction:column}.btn{width:100%;justify-content:center}}
    </style>
</head>
<body>
    <div class="card">
        <h1>🏆 Leaderboard</h1>
        <div class="sub">
            <span>supabase · en tiempo real</span>
            <span id="statusBadge">● conectado</span>
        </div>

        <div class="msg" id="msg"></div>

        <form id="scoreForm" class="form-row">
            <div class="form-group">
                <label for="nameInput">Nombre</label>
                <input type="text" id="nameInput" placeholder="Ej: Carmine" required />
            </div>
            <div class="form-group">
                <label for="scoreInput">Puntaje</label>
                <input type="number" id="scoreInput" placeholder="0" min="0" step="1" required />
            </div>
            <button type="submit" class="btn" id="submitBtn">Enviar</button>
        </form>

        <div class="lb-header">
            <h2>Ranking</h2>
            <span class="count" id="countLabel">0 entradas</span>
        </div>
        <ul class="lb-list" id="lbList">
            <li class="lb-empty">Cargando registros …</li>
        </ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            'use strict';

            // ─── 🔑 CONFIGURACIÓN ──────────────────────────
            const SUPABASE_URL = 'https://faoziaawqxettcazbryq.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_kmZm7clazKO4SRyMC9oD6g_Zaz1AlDi';

            // ─── Inicializar ────────────────────────────────
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // ─── DOM ─────────────────────────────────────────
            const form = document.getElementById('scoreForm');
            const nameInput = document.getElementById('nameInput');
            const scoreInput = document.getElementById('scoreInput');
            const submitBtn = document.getElementById('submitBtn');
            const lbList = document.getElementById('lbList');
            const countLabel = document.getElementById('countLabel');
            const msgEl = document.getElementById('msg');
            const statusBadge = document.getElementById('statusBadge');

            // ─── Helpers ─────────────────────────────────────
            function mostrarMensaje(texto, tipo = 'info') {
                msgEl.className = 'msg show ' + tipo;
                msgEl.textContent = texto;
            }

            function ocultarMensaje() {
                msgEl.className = 'msg';
                msgEl.textContent = '';
            }

            function setCargando(loading) {
                submitBtn.disabled = loading;
                submitBtn.innerHTML = loading ? '<span class="spinner"></span> Enviando …' : 'Enviar';
            }

            function setEstado(texto, color = '#7e8aa8') {
                statusBadge.textContent = texto;
                statusBadge.style.color = color;
            }

            // ─── Renderizar ──────────────────────────────────
            function renderizar(entries) {
                if (!entries || entries.length === 0) {
                    lbList.innerHTML =
                        `<li class="lb-empty">✨ Sin registros aún – ¡sé el primero!</li>`;
                    countLabel.textContent = '0 entradas';
                    return;
                }
                let html = '';
                entries.forEach((item, idx) => {
                    const rank = idx + 1;
                    let rankClass = 'lb-rank';
                    if (rank === 1) rankClass += ' gold';
                    else if (rank === 2) rankClass += ' silver';
                    else if (rank === 3) rankClass += ' bronze';
                    const nombre = escapeHtml(item.name || 'Anónimo');
                    const puntaje = Number(item.score) || 0;
                    html += `
                            <li class="lb-item">
                                <span class="${rankClass}">#${rank}</span>
                                <span class="lb-name">${nombre}</span>
                                <span class="lb-score">${puntaje.toLocaleString()}</span>
                            </li>
                        `;
                });
                lbList.innerHTML = html;
                countLabel.textContent = `${entries.length} entrada${entries.length !== 1 ? 's' : ''}`;
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ─── Cargar datos ────────────────────────────────
            async function cargarLeaderboard() {
                try {
                    setEstado('⟳ cargando …', '#b7c9ff');
                    const { data, error } = await supabase
                        .from('scores')
                        .select('*')
                        .order('score', { ascending: false })
                        .limit(100);
                    if (error) throw error;
                    renderizar(data);
                    setEstado('● sincronizado', '#4ac78a');
                    ocultarMensaje();
                } catch (err) {
                    console.error(err);
                    lbList.innerHTML = `<li class="lb-empty">⚠️ Error al cargar</li>`;
                    countLabel.textContent = '—';
                    setEstado('● error', '#d45a5a');
                    mostrarMensaje('Error: ' + err.message, 'error');
                }
            }

            // ─── Suscripción en tiempo real ──────────────────
            let unsubscribe = null;

            function suscribirCambios() {
                if (unsubscribe) unsubscribe();
                const channel = supabase
                    .channel('scores_channel')
                    .on('postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'scores'
                    }, () => cargarLeaderboard())
                    .subscribe((status) => {
                        if (status === 'SUBSCRIBED') setEstado('● en tiempo real', '#4ac78a');
                    });
                unsubscribe = () => supabase.removeChannel(channel);
            }

            // ─── Enviar puntaje ──────────────────────────────
            async function enviarPuntaje(nombre, puntaje) {
                const nombreLimpio = nombre.trim().slice(0, 60);
                if (!nombreLimpio) {
                    mostrarMensaje('Ingresa un nombre.', 'error');
                    return false;
                }
                const numPuntaje = Number(puntaje);
                if (!Number.isFinite(numPuntaje) || numPuntaje < 0 || !Number.isInteger(numPuntaje)) {
                    mostrarMensaje('Puntaje entero >= 0.', 'error');
                    return false;
                }

                setCargando(true);
                ocultarMensaje();

                try {
                    const { error } = await supabase
                        .from('scores')
                        .insert([{ name: nombreLimpio, score: numPuntaje }]);
                    if (error) throw error;
                    mostrarMensaje(`✅ Guardado: ${nombreLimpio} · ${numPuntaje.toLocaleString()}`, 'success');
                    nameInput.value = '';
                    scoreInput.value = '';
                    cargarLeaderboard();
                    return true;
                } catch (err) {
                    console.error(err);
                    mostrarMensaje(`❌ Falló: ${err.message}`, 'error');
                    return false;
                } finally {
                    setCargando(false);
                }
            }

            // ─── Eventos ──────────────────────────────────────
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                enviarPuntaje(nameInput.value, scoreInput.value);
            });

            // ─── Inicio ──────────────────────────────────────
            cargarLeaderboard();
            suscribirCambios();

            // Exponer para depuración
            window.__leaderboard = { supabase, cargarLeaderboard, enviarPuntaje };
            console.log('🏆 Leaderboard con Supabase listo.');
        })();
    </script>
</body>
</html>
